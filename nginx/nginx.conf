user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" rt=$request_time '
                      'upstream_addr=$upstream_addr '
                      'upstream_status=$upstream_status '
                      'upstream_response_time=$upstream_response_time '
                      'upstream_connect_time=$upstream_connect_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 10s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
    # Maltrail sees every client as nginx's address, so its own lockout (5 failed
    # logins) is global. Throttle guessing per real client here, before it gets there.
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    upstream app_backend {
        # `resolve` (nginx >= 1.27.3) re-resolves the name, so a recreated
        # maltrail-server with a new IP does not leave nginx proxying to the old one.
        zone app_backend 64k;
        server maltrail-server:8338 resolve max_fails=3 fail_timeout=10s;

        keepalive 16;
        keepalive_timeout 30s;
        keepalive_requests 100;
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;

        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        error_page 497 =301 https://$host:$server_port$request_uri;

        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ---- proxy settings, inherited by both proxied locations below ----
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;

        proxy_set_header Connection "";

        # Maltrail sets `Secure` on its session cookie only when it terminates TLS
        # itself (USE_SSL). Here nginx does, so add the flag on the way out.
        proxy_cookie_flags ~ secure;

        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_timeout 30s;
        proxy_next_upstream_tries 3;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        # The /live event stream (SSE) sends a heartbeat every ~15s and disables
        # buffering itself with `X-Accel-Buffering: no`, so 60s is enough for it.
        proxy_read_timeout 60s;

        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;

        proxy_intercept_errors on;
        proxy_ignore_client_abort off;

        # /login/params (nonce) + POST /login: two requests per attempt.
        location ^~ /login {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://app_backend;
        }

        location / {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://app_backend;
        }

        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
