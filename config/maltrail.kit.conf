# =============================================================================
# maltrail-kit — container invariants (layer 2 of 3, tracked in git)
# =============================================================================
# Appended after the upstream maltrail.conf and before maltrail.local.conf.
# Only settings that docker-compose.yml, nginx.conf or the healthchecks depend
# on belong here, pinned so an upstream default change cannot break the stack.
# Host-specific settings go in maltrail.local.conf, not here.
# =============================================================================

# ---- server ----------------------------------------------------------------
# nginx proxies to maltrail-server:8338 and the healthcheck probes 8338/ping.
HTTP_ADDRESS 0.0.0.0
HTTP_PORT 8338

# TLS terminates at nginx; the hop nginx -> server stays on the `main` bridge.
USE_SSL false

# Event intake from remote sensors. compose publishes it as EVENTS_UDP_PORT.
UDP_ADDRESS 0.0.0.0
UDP_PORT 8337

# ---- server + sensor -------------------------------------------------------
# The maltrail_logs volume. The server reads what the local sensor writes here.
LOG_DIR /var/log/maltrail
